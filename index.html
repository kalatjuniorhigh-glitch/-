<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#7fcaa0;--s:#e0656a;--g:#d9b445;--bg:#16130f;--c:#1f1b15;--t:#ece6d6;--m:#a39b86;--b:#383226}}
:root[data-theme="dark"]{--p:#7fcaa0;--s:#e0656a;--g:#d9b445;--bg:#16130f;--c:#1f1b15;--t:#ece6d6;--m:#a39b86;--b:#383226}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:'Amiri','Noto Naskh Arabic','Segoe UI',Tahoma,Georgia,serif;line-height:1.6}
.band{height:6px;background:linear-gradient(90deg,#a3262b 0 33.3%,#f4efe2 33.3% 66.6%,#1b4d3a 66.6%)}
header{background:#143a2b;color:#f5f1e6;text-align:center;padding:1.6rem 1rem 1.2rem;border-bottom:3px solid var(--g);position:relative}
header::after{content:"";position:absolute;inset:auto 0 -9px 0;height:6px;background:repeating-linear-gradient(135deg,var(--g) 0 6px,transparent 6px 12px);opacity:.55}
.sun{width:58px;height:58px;display:block;margin:0 auto .5rem}
header h1{margin:0;font-size:clamp(1.4rem,5vw,2.1rem);font-weight:700;letter-spacing:.02em}
header p{margin:.4rem 0 .9rem;opacity:.85;font-size:1rem}
.ui{display:inline-flex;gap:.4rem}
.ui button{background:transparent;border:1px solid #c9a22799;color:#f5f1e6;border-radius:3px;padding:.25rem .9rem;cursor:pointer;font:inherit}
.ui button.on{background:var(--g);color:#143a2b;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:1.4rem 1rem}
.tabs{display:flex;gap:.2rem;justify-content:center;margin-bottom:1.2rem;border-bottom:1px solid var(--b);overflow-x:auto}
.tab{padding:.7rem 1rem;border:none;border-bottom:3px solid transparent;background:none;color:var(--m);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--s);border-color:var(--s)}
.controls{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1rem;align-items:center}
input,select{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:4px;padding:.6rem .9rem;width:100%}
#q{max-width:520px}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.chip,.tool{background:var(--c);border:1px solid var(--b);color:var(--p);padding:.35rem .9rem;border-radius:3px;cursor:pointer;font:inherit;font-weight:700}
.chip.on{background:var(--p);color:var(--c);border-color:var(--p)}
.lab{color:var(--m);font-size:.9rem;display:block;text-align:center;margin-bottom:.3rem}
.count{text-align:center;color:var(--m);margin:0 0 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1rem}
.card{background:var(--c);border:1px solid var(--b);border-top:3px solid var(--s);border-radius:3px;padding:1rem;display:flex;flex-direction:column;justify-content:space-between;gap:.8rem}
.cat{font-size:.78rem;color:var(--s);font-weight:700}
.ti{font-size:1.15rem;font-weight:700;color:var(--p);margin:.2rem 0;line-height:1.4}
.au{font-size:.92rem;color:var(--m)}
.acts{display:flex;gap:.5rem}
.btn{flex:1;text-align:center;padding:.5rem;border-radius:3px;text-decoration:none;font-size:.9rem;font-weight:700;background:var(--p);color:var(--c)}
.btn.d{background:transparent;color:var(--p);border:1px solid var(--p)}
.del{background:none;border:none;color:var(--s);cursor:pointer;font-size:.8rem;padding:0;align-self:flex-start}
.star{background:none;border:none;color:var(--g);font-size:1.25rem;cursor:pointer;padding:0;line-height:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
#banner:not(:empty){background:var(--c);border:1px solid var(--g);border-radius:3px;padding:.8rem 1rem;margin-bottom:1rem;text-align:center}
#banner .chip{margin:.4rem .2rem 0}
.stats{text-align:center;color:var(--m);font-size:.95rem;margin-bottom:1rem;padding:.6rem;border:1px dashed var(--g);border-radius:3px}
.stats b{color:var(--s);font-size:1.15rem}
.stats span{display:inline-block;margin:0 .6rem}
.none{grid-column:1/-1;text-align:center;color:var(--m);padding:2rem}
dialog{border:1px solid var(--b);border-top:3px solid var(--g);border-radius:4px;background:var(--c);color:var(--t);width:min(92vw,460px);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog label{display:block;margin:.55rem 0 .2rem;font-size:.9rem}
.row{display:flex;gap:.5rem;margin-top:1rem}
footer{text-align:center;color:var(--m);padding:1.5rem 1rem;font-size:.85rem}
</style>
</head>
