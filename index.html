 $('grid').innerHTML=list.length?list.map(b=>{const[u,d]=L(b);
  return `<div class="card" dir="${b.l==='en'?'ltr':'rtl'}"><div>${/^(data:image\/(jpeg|png);base64,|books\/)/.test(b.i||'')?`<img class="cov" alt="" src="${esc(b.i)}">`:''}<div class="top"><div class="cat">${esc(CT[b.c]?CT[b.c][ui]:'')} · ${LN[ui][b.l]}</div><button class="star" data-f="${esc(idOf(b))}" aria-label="favorite">${favs.includes(idOf(b))?'★':'☆'}</button></div><div class="ti">${esc(b.t)}</div><div class="au">${esc(b.a)}</div></div>
  <div class="acts">${(u||b.e)?'':`<span class="au">${s.soon}</span>`}<a class="btn" style="${u?'':'display:none'}" target="_blank" rel="noopener" href="${esc(u)}">${b.k==='b'?s.read:b.k==='a'?s.listen:(b.k==='j'||b.k==='r'||b.k==='w')?(b.k==='w'&&!b.r?s.read:s.open):b.k==='e'?(b.r?s.open:s.watch):s.watch}</a>${d?`<a class="btn d" target="_blank" rel="noopener" href="${esc(d)}">${s.dl}</a>`:''}${(b.e&&/^https:\/\//.test(b.e))?`<a class="btn d" target="_blank" rel="noopener" href="${esc(b.e)}">${s.cp2}</a>`:''}</div>
  ${cross(b,s)}${(ADM&&b.x!==undefined)?`<button class="del" data-x="${b.x}">${s.del}</button>`:''}</div>`}).join(''):`<div class="none">${(tab==='w'&&mode==='tab'&&!q&&lvl==='all'&&lang==='all')?s.wempty:s.none}</div>`;
}
function applyUI(){
 const s=T[ui];document.documentElement.lang=ui;document.documentElement.dir=s.dir;
 $('h1').textContent=s.h;$('sub').textContent=s.sub;$('q').placeholder=s.q;$('l1').textContent=s.cl;
 $('l2').textContent=s.lvlab;$('shareBtn').textContent=s.share;$('sh0').textContent=s.share.replace('🔗 ','');$('sh1').textContent=s.libLink;$('sh2').textContent=s.listName;$('sh3').textContent=s.qrt;$('shx').textContent=s.close;$('nat').textContent=s.share;document.querySelectorAll('[data-cp]').forEach(b=>b.textContent=s.copy);
 ['addBtn','expBtn','impBtn'].forEach(id=>$(id).style.display=ADM?'':'none');
 $('addBtn').textContent=s.add;$('expBtn').textContent=s.exp;$('impBtn').textContent=s.imp;$('foot').textContent=s.foot+' · v2026.10.07-c';document.title=s.h.replace('','');
 $('dh').textContent=s.ah;s.f.forEach((v,i)=>$('d'+i).textContent=v);$('save').textContent=s.save;$('cancel').textContent=s.cancel;
 $('fK').innerHTML=['b','a','v','j','e','r','w'].map(k=>`<option value="${k}">${s.tabs[k]}</option>`).join('');
 $('fL').innerHTML=['ar','ku','en'].map(l=>`<option value="${l}">${LN[ui][l]}</option>`).join('');
 $('fC').innerHTML=Object.keys(CT).map(c=>`<option value="${c}">${CT[c][ui]}</option>`).join('');
 document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.dataset.u===ui));
 render();
}
$('ui').onclick=e=>{const u=e.target.dataset.u;if(u){ui=u;try{localStorage.setItem(KEY+'_ui',u)}catch(_){}applyUI()}};
$('tabs').onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;mode='tab';cat='all';render()}};
$('lvls').onclick=e=>{const v=e.target.dataset.v;if(v){lvl=v;render()}};
$('favBtn').onclick=()=>{mode=mode==='fav'?'tab':'fav';cat='all';render()};
$('banner').onclick=e=>{const a=e.target.dataset.bn;if(a==='save'){shared.i.forEach(i=>{if(!favs.includes(i))favs.push(i)});saveFav();mode='fav';render()}else if(a==='back'){mode='tab';shared=null;history.replaceState(null,'',baseUrl());render()}};
$('langs').onclick=e=>{const l=e.target.dataset.l;if(l){lang=l;render()}};
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$('q').oninput=render;
$('grid').onclick=e=>{
 const f=e.target.dataset.f;
 if(f){const i=favs.indexOf(f);i>=0?favs.splice(i,1):favs.push(f);saveFav();render();return}
 const g=e.target.dataset.go;
 if(g){const[k,l,...t]=g.split('|');tab=k;lang=l;cat='all';$('q').value=t.join('|');render();window.scrollTo({top:0,behavior:'smooth'});return}
const x=e.target.dataset.x;if(x!==undefined&&confirm(T[ui].conf)){extra.splice(+x,1);persist();render()}};
$('addBtn').onclick=()=>{$('fK').value=tab;$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('save').onclick=()=>{const t=$('fT').value.trim();if(!t){$('fT').focus();return}
 extra.push({k:$('fK').value,t,a:$('fA').value.trim(),l:$('fL').value,c:$('fC').value,r:$('fR').value.trim(),d:$('fD').value.trim()});
 persist();['fT','fA','fR','fD'].forEach(i=>$(i).value='');$('dlg').close();render()};
$('expBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(extra,null,1)],{type:'application/json'}));a.download='my-library.json';a.click()};
$('impBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
  extra=extra.concat(d.filter(b=>b&&b.t).map(b=>({k:['b','a','v','j','e','r','w'].includes(b.k)?b.k:'b',t:String(b.t),a:String(b.a||''),l:['ar','ku','en'].includes(b.l)?b.l:'ar',c:CT[b.c]?b.c:'lit',r:b.r||'',d:b.d||''})));persist();render()}catch(_){alert(T[ui].bad)}};
 r.readAsText(f);e.target.value=''};

async function loadCatalog(){
 try{const r=await fetch('catalog.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();
  const K=['b','a','v','j','e','r','w'];
  (Array.isArray(d)?d:(d.items||[])).forEach(b=>{if(b&&b.t)DATA.push({k:K.includes(b.k)?b.k:'b',t:String(b.t),a:String(b.a||''),l:['ar','ku','en'].includes(b.l)?b.l:'ar',c:CT[b.c]?b.c:'lit',r:b.r||'',d:b.d||'',i:/^(data:image\/(jpeg|png);base64,|books\/)/.test(b.i||'')?b.i:''})});
  const hide=new Set((d.hide||[]).map(String));
  if(hide.size)for(let i=DATA.length-1;i>=0;i--)if(hide.has(DATA[i].t)||hide.has(idOf(DATA[i])))DATA.splice(i,1);
  render()}catch(e){}}
function drawQR(t){const el=$('qr');el.innerHTML='';try{if(window.QRCode&&t.length<900)new QRCode(el,{text:t,width:160,height:160})}catch(e){}}
function refreshShare(){$('u1').value=baseUrl();$('u2').value=favs.length?listUrl():'';$('u2').style.display=$('ln').style.display=favs.length?'':'none';$('sh2').style.display=favs.length?'':'none'}
$('shareBtn').onclick=()=>{refreshShare();drawQR(baseUrl());$('nat').style.display=navigator.share?'':'none';$('sh').showModal()};
$('shx').onclick=()=>$('sh').close();
$('ln').oninput=refreshShare;
$('nat').onclick=()=>{try{navigator.share({title:T[ui].h,url:favs.length?listUrl():baseUrl()})}catch(e){}};
$('sh').onclick=e=>{const id=e.target.dataset.cp;if(id){const i=$(id);if(!i.value)return;i.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}try{navigator.clipboard&&navigator.clipboard.writeText(i.value);ok=true}catch(_){}e.target.textContent=T[ui].copied;setTimeout(()=>e.target.textContent=T[ui].copy,1500)}};
readHash();
initCounter();
loadCatalog();
applyUI();
</script>
</body>
</html>
